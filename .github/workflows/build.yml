name: Java CI
on: [ push, pull_request ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest', 'macos-latest', 'ubuntu-latest' ]
        java: [ '17', '21', '23' ] # TODO: semeru doesn't support jdk24 yet...
        distribution: [ 'semeru', 'temurin' ]

    name: Test on ${{ matrix.os }} with Java ${{ matrix.java }} (${{ matrix.distribution }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.distribution == 'temurin' || matrix.os != 'macos-latest'
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Test with Gradle
        uses: gradle/actions/setup-gradle@v3
        if: matrix.distribution == 'temurin' || matrix.os != 'macos-latest'
        with:
          arguments: test --stacktrace
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build -x javadoc -x test
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs